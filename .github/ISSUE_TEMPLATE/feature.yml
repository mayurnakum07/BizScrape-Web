name: Feature
description: Propose a focused improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Concrete change. Prefer small, reviewable scope.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Web UI
        - Python API
        - Engine / CLI
        - Docs
        - Multiple
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints you already considered
      options:
        - label: Does not require inventing AI features
        - label: Keeps scraping logic in Python
        - label: Avoids multi-instance job state without a persistence design
