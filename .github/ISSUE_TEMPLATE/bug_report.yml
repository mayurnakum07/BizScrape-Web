---
name: Bug report
description: Report a bug in BizScrape
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Do **not** paste real personal contact data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal command line / inputs (synthetic data only)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BizScrape version
      placeholder: "0.1.0"
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Windows, macOS, Linux, Other]
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact any personal names, phones, or emails
