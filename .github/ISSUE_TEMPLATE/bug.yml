name: Bug
description: Something broken in the UI, API, or engine
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do **not** paste credentials or scraped personal datasets.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web UI
        - Python API
        - Scrape engine / CLI
        - CSV export
        - Docs / CI
        - Unsure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Expected vs actual behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Environment
      description: "OS, Node, Python, browser (if UI)."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Redact secrets. Prefer API status codes and sanitized messages.
